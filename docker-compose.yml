version: '3.8'
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
      - AzureServiceBus__ConnectionString=${SERVICEBUS_CONNECTION}
  frontend:
    build: ./frontend-vanilla
    ports:
      - "3000:80"
