version: '3.8'

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bcimplementatie-sql
    environment:
      SA_PASSWORD: "P@ssw0rd123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD", "bash", "-c", "exit 0"]
      interval: 10s
      retries: 1

  bcimplementatie:
    build:
      context: ./BCImplementatie
      dockerfile: Dockerfile
    container_name: bcimplementatie
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__ImplementatieDb=Server=tcp:sqlserver,1433;Database=Implementatie;User Id=sa;Password=P@ssw0rd123;TrustServerCertificate=True
    ports:
      - "8080:80"

  bffapi:
    build:
      context: ./BFFApi
      dockerfile: Dockerfile
    container_name: bffapi
    depends_on:
      - bcimplementatie
    environment:
      - ASPNETCORE_URLS=http://+:80
      - IMPLEMENTATIE_API_URL=http://bcimplementatie/api
      - X_API_KEY=MijnSuperGeheimeKey123
    ports:
      - "3000:80"
