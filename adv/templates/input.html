<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Care-Tech Advisor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body class="p-5">
  <div class="container" style="max-width:600px;">
    <h2 class="mb-4">Enter API Key &amp; Payload</h2>

    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}
        <div class="alert alert-{{cat}}">{{msg}}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="mb-3">
        <label class="form-label">X-API-KEY</label>
        <input type="password" name="api_key"
               value="{{ api_key }}"
               class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">JSON Payload</label>
        <textarea name="body" rows="8" class="form-control" required>{{ body_text }}</textarea>
      </div>

      <button class="btn btn-primary">Send →</button>
    </form>
  </div>
</body>
</html>
