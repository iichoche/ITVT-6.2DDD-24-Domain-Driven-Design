<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Step 2 – Enter Request Body</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body class="p-5">
  <div class="container" style="max-width:600px;">
    <h2 class="mb-4">Step 2: Request Body</h2>
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}
        <div class="alert alert-{{cat}}">{{msg}}</div>
      {% endfor %}
    {% endwith %}
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Raw JSON Payload</label>
        <textarea name="body" rows="8" class="form-control">{{body_text}}</textarea>
      </div>
      <button class="btn btn-primary">Submit →</button>
    </form>
  </div>
</body>
</html>
