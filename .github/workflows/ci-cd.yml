# .github/workflows/ci-cd.yml

name: CI/CD Pipeline

on:
  push:
    branches:
      - Implementatie

env:
  # Jouw Container Registry login-server zonder suffix
  ACR_NAME: bcimplementatie-ehccd8f4bmb3gkh7
  IMAGE_NAME: bcimplementatie
  # Naam van je Azure Web App for Containers
  WEBAPP_NAME: implementatieapp-fucddyd2hqaaa8a7
  # Resource group waarin zowel de ACR als de Web App zitten
  RESOURCE_GROUP: BCImplementatie
  # Slot (default ‘production’)
  AZURE_WEBAPP_SLOT: production

jobs:
  build_and_test:
    name: 🛠️ Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore solution
        run: dotnet restore BCImplementatie/BCImplementatie.sln


      - name: Build solution
        run: dotnet build --no-restore BCImplementatie/BCImplementatie.sln --configuration Release

      - name: Run unit tests
        run: dotnet test BCImplementatie/BCImplementatie.Tests/BCImplementatie.Tests.csproj --no-build --verbosity normal


  docker_and_deploy:
    name: 🐳 Build & Deploy Docker image
    needs: build_and_test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_NAME }}.azurecr.io
          username:     ${{ secrets.ACR_USERNAME_IMPLEMENTATIE }}
          password:     ${{ secrets.ACR_PASSWORD_IMPLEMENTATIE }}

      - name: Build and push Docker image
        run: |
          docker build \
            --file BCImplementatie/Dockerfile \
            --tag ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest \
            --tag ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to Azure Web App for Containers
        uses: azure/webapps-deploy@v2
        with:
          app-name:       ${{ env.WEBAPP_NAME }}
          slot-name:      ${{ env.AZURE_WEBAPP_SLOT }}
          images:         ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          publish-profile: ${{ secrets.IMPLEMENTATIEAPPPUBLISHSETTINGS }}
